<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" fill="url(#grad1)" rx="32"/>
  
  <!-- Campus building/connection concept -->
  <!-- Left building -->
  <rect x="32" y="64" width="40" height="80" fill="white" opacity="0.95"/>
  <rect x="40" y="72" width="8" height="12" fill="#3b82f6"/>
  <rect x="56" y="72" width="8" height="12" fill="#3b82f6"/>
  <rect x="40" y="92" width="8" height="12" fill="#3b82f6"/>
  <rect x="56" y="92" width="8" height="12" fill="#3b82f6"/>
  <rect x="40" y="112" width="8" height="12" fill="#3b82f6"/>
  <rect x="56" y="112" width="8" height="12" fill="#3b82f6"/>
  
  <!-- Right building -->
  <rect x="120" y="64" width="40" height="80" fill="white" opacity="0.95"/>
  <rect x="128" y="72" width="8" height="12" fill="#3b82f6"/>
  <rect x="144" y="72" width="8" height="12" fill="#3b82f6"/>
  <rect x="128" y="92" width="8" height="12" fill="#3b82f6"/>
  <rect x="144" y="92" width="8" height="12" fill="#3b82f6"/>
  <rect x="128" y="112" width="8" height="12" fill="#3b82f6"/>
  <rect x="144" y="112" width="8" height="12" fill="#3b82f6"/>
  
  <!-- Connection line between buildings -->
  <line x1="72" y1="104" x2="120" y2="104" stroke="white" stroke-width="4" opacity="0.9"/>
  
  <!-- Center connection node -->
  <circle cx="96" cy="104" r="6" fill="white"/>
</svg>
